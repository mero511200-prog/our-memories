
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little World</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #f7b8d3;
  --deep: #b83d7a;
  --ink: #87365f;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: var(--ink);
  background: #f8c5dc;
}

/* الدوامة اللي ورا الموقع كله */
.vortex {
  position: fixed;
  inset: -65%;
  z-index: -2;
  pointer-events: none;
  background:
    repeating-conic-gradient(
      from 0deg,
      #fce6f1 0deg 9deg,
      #ed8cba 13deg 23deg,
      #bc3c7e 28deg 34deg,
      #ffddeb 40deg 51deg
    );
  -webkit-mask-image: radial-gradient(
    ellipse, transparent 0%, #000 13%, #000 100%
  );
  mask-image: radial-gradient(
    ellipse, transparent 0%, #000 13%, #000 100%
  );
  animation: vortexSpin 13s linear infinite;
  filter: blur(2px);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center,
      #fff1f8 0%,
      #f8c3dd 45%,
      #df70a5 100%);
  opacity: .75;
}

@keyframes vortexSpin {
  from { transform: rotate(0deg) scale(1); }
  to   { transform: rotate(360deg) scale(1.04); }
}

/* الموقع بيتسحب لجوا وبعدين يظهر */
.scene {
  min-height: 100vh;
  padding: 48px 18px 35px;
  text-align: center;
  transform-origin: center center;
  animation: pulledIn 2.4s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes pulledIn {
  0% {
    opacity: 0;
    transform: scale(.04) rotate(-540deg);
    filter: blur(18px);
  }
  55% {
    opacity: 1;
    transform: scale(.48) rotate(-190deg);
    filter: blur(5px);
  }
  78% {
    transform: scale(1.07) rotate(12deg);
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    filter: blur(0);
  }
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(35px, 7vw, 65px);
  font-weight: normal;
  color: #a73870;
  margin: 10px 0 36px;
  text-shadow: 0 2px 18px #fff;
  animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
  from { text-shadow: 0 0 8px #fff; }
  to   { text-shadow: 0 0 28px #fff, 0 0 42px #ed91bc; }
}

/* الظرفين */
.envelopes {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 5vw, 55px);
  flex-wrap: wrap;
  max-width: 850px;
  margin: 0 auto;
}

.card {
  width: min(100%, 330px);
  padding: 25px 20px;
  border: 1px solid #fff9;
  border-radius: 28px;
  background: linear-gradient(
    145deg,
    #fff8fcf2,
    #fce3eff0
  );
  box-shadow:
    0 18px 55px #922b5d30,
    inset 0 0 25px #fff9;
  backdrop-filter: blur(10px);
  animation: floatCard 4s ease-in-out infinite;
}

.card:nth-child(2) {
  animation-delay: -2s;
}

@keyframes floatCard {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-9px) rotate(1deg); }
}

.card h2 {
  font-size: 25px;
  margin: 0 0 20px;
  color: #a53c71;
}

/* الظرف مرسوم بالكود، مش صورة */
.envelope {
  position: relative;
  width: min(100%, 245px);
  height: 155px;
  margin: 15px auto 18px;
  cursor: pointer;
  perspective: 700px;
  filter: drop-shadow(0 10px 9px #a536682b);
  transition: transform .3s;
}

.envelope:hover {
  transform: translateY(-5px);
}

.envelope .back {
  position: absolute;
  inset: 0;
  background: #e985b3;
  border-radius: 8px;
}

.envelope .letter {
  position: absolute;
  z-index: 1;
  left: 8%;
  width: 84%;
  height: 90%;
  bottom: 3%;
  border-radius: 8px;
  background: #fffafd;
  transition: transform .8s ease;
}

.envelope .front {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: #f4a5ca;
  clip-path: polygon(0 0, 50% 57%, 100% 0, 100% 100%, 0 100%);
  border-radius: 0 0 8px 8px;
}

.envelope .flap {
  position: absolute;
  z-index: 4;
  inset: 0;
  background: #f9c6de;
  clip-path: polygon(0 0, 100% 0, 50% 59%);
  transform-origin: top center;
  transition: transform .65s ease;
}

.envelope .seal {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 43%;
  transform: translate(-50%, -50%);
  color: #b42f70;
  font-size: 31px;
  transition: opacity .3s;
}

/* فتح الظرف وطلوع الورقة */
.envelope.open .flap {
  transform: rotateX(180deg);
  z-index: 0;
}

.envelope.open .letter {
  transform: translateY(-78px);
}

.envelope.open .seal {
  opacity: 0;
}

.story-button {
  display: inline-block;
  min-width: 185px;
  padding: 13px 22px;
  border: 0;
  border-radius: 30px;
  color: white;
  background: linear-gradient(135deg, #d85291, #a92d70);
  box-shadow: 0 6px 16px #a92d7040;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.story-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 22px #a92d7050;
}

.paper {
  display: none;
  margin-top: 20px;
  padding: 16px;
  border-radius: 18px;
  background: #fffafd;
  text-align: right;
  animation: paperRise .7s ease both;
}

.paper.show {
  display: block;
}

@keyframes paperRise {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.photo {
  display: block;
  width: 150px;
  height: 150px;
  max-width: 100%;
  margin: 0 auto 14px;
  object-fit: cover;
  border-radius: 18px;
  background: #f8d9e8;
  border: 3px solid white;
  box-shadow: 0 4px 18px #ad477630;
}

.paper h3 {
  text-align: center;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 12px;
  border: 1px solid #e5a4c5;
  border-radius: 12px;
  background: white;
  font: inherit;
  line-height: 1.8;
}

.status {
  text-align: center;
  font-size: 13px;
  color: #965575;
}

@media (max-width: 600px) {
  .scene {
    padding-top: 28px;
  }

  .card {
    padding: 22px 15px;
  }

  .envelopes {
    gap: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .scene {
    animation-duration: .2s;
  }

  .vortex,
  .card,
  h1 {
    animation-duration: 20s;
  }
}
</style>
</head>

<body>

<div class="vortex" aria-hidden="true"></div>

<main class="scene">
  <h1>Our Little World</h1>

  <div class="envelopes">

    <!-- ظرف مريم -->
    <section class="card">
      <h2>حكاية مريم</h2>

      <div class="envelope" id="envMaryam"
           role="button" tabindex="0"
           aria-label="فتح ظرف مريم"
           onclick="toggleLetter('maryam')"
           onkeydown="keyOpen(event, 'maryam')">
        <div class="back"></div>
        <div class="letter"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>

      <button class="story-button"
              onclick="toggleLetter('maryam')">
        دي حكايتي
      </button>

      <div class="paper" id="maryam">
        <img class="photo" id="maryamPhoto"
             src="" alt="صورة مريم"
             hidden>
        <h3>دي حكايتي 💗</h3>
        <p id="maryamStory">
          هنا هنضيف صورتك وحكايتك اللي كتبتيها.
        </p>
      </div>
    </section>

    <!-- ظرف محمد -->
    <section class="card">
      <h2>حكاية محمد</h2>

      <div class="envelope" id="envMohamed"
           role="button" tabindex="0"
           aria-label="فتح ظرف محمد"
           onclick="toggleLetter('mohamed')"
           onkeydown="keyOpen(event, 'mohamed')">
        <div class="back"></div>
        <div class="letter"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>

      <button class="story-button"
              onclick="toggleLetter('mohamed')">
        حكايتك
      </button>

      <div class="paper" id="mohamed">
        <img class="photo" id="mohamedPhoto"
             src="" alt="صورة محمد"
             hidden>
        <h3>حكايتك يا محمد</h3>
        <textarea id="story"
          placeholder="اكتب حكايتك هنا..."></textarea>
        <button class="story-button"
                onclick="saveStory()">
          حفظ الحكاية
        </button>
        <p class="status" id="saveStatus">
          هنفعّل الحفظ المشترك أونلاين في الخطوة الجاية.
        </p>
      </div>
    </section>

  </div>
</main>

<script>
function toggleLetter(id) {
  const paper = document.getElementById(id);
  const isOpening = !paper.classList.contains("show");
  const envelopeId = id === "maryam"
    ? "envMaryam"
    : "envMohamed";

  paper.classList.toggle("show");
  document.getElementById(envelopeId)
    .classList.toggle("open", isOpening);
}

function keyOpen(event, id) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleLetter(id);
  }
}

function saveStory() {
  document.getElementById("saveStatus").textContent =
    "الحفظ المشترك لسه محتاج ربط Supabase.";
}
</script>

</body>
</html>
